<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>GameRant Banner Lab</title>
<style>
@font-face{font-family:Khand;font-style:normal;font-weight:400;font-display:swap;src:url("https://static1.gamerantimages.com/assets/fonts/khand/khand-regular.woff2") format("woff2")}
@font-face{font-family:Khand;font-style:normal;font-weight:700;font-display:swap;src:url("https://static1.gamerantimages.com/assets/fonts/khand/khand-bold.woff2") format("woff2")}
@font-face{font-family:Roboto;font-style:normal;font-weight:400;font-display:swap;src:url("https://static1.gamerantimages.com/assets/fonts/roboto/roboto-regular.woff2") format("woff2")}
@font-face{font-family:Roboto;font-style:normal;font-weight:700;font-display:swap;src:url("https://static1.gamerantimages.com/assets/fonts/roboto/roboto-bold.woff2") format("woff2")}
:root{--orange:#f47938;--orange2:#d4510c;--bg:#181818;--panel:#242424;--panel2:#333;--line:#515151;--text:#fff;--muted:#b6b4b5;--surface:#252525;--input:#181818;--shadow:0 4px 12px rgba(0,0,0,.3);--header:#252525;--nav:#101010;--checker:rgba(255,255,255,.055)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit}
button{color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 13px;cursor:pointer;font-weight:700;transition:background .2s,border-color .2s,color .2s,opacity .2s}
button:hover{border-color:var(--orange);color:var(--orange)}
button.active,button.primary{background:var(--orange);border-color:var(--orange);color:#fff}
button.primary:hover{background:var(--orange2);border-color:var(--orange2);color:#fff}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
input:not([type=checkbox]):not([type=color]):not([type=range]):not([type=file]),select,textarea{width:100%;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-width:0}
input:not([type=checkbox]):not([type=color]):not([type=range]):not([type=file]):hover,select:hover,textarea:hover,input:not([type=checkbox]):not([type=color]):not([type=range]):not([type=file]):focus,select:focus,textarea:focus{border-color:var(--muted);outline:none}
input[type=range]{width:100%;accent-color:var(--orange)}
input[type=checkbox]{accent-color:var(--orange)}
input[type=color]{width:44px;height:38px;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:3px;cursor:pointer}
textarea{resize:vertical;min-height:85px;line-height:1.5}
.rich-editor{border:1px solid var(--line);border-radius:8px;background:var(--input);overflow:visible;min-width:0}
.rich-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding:8px;border-bottom:1px solid var(--line);background:var(--panel2);border-radius:7px 7px 0 0}
.rich-toolbar button{width:32px;height:33px;min-width:32px;padding:4px;border-radius:6px;text-align:center}
.rich-toolbar button[data-rich-command="bold"]{font-weight:900;font-size:17px}
.rich-toolbar button[data-rich-command="italic"]{font-style:italic;font-family:Georgia,serif;font-size:18px}
.rich-toolbar button[data-rich-command="underline"]{text-decoration:underline;font-size:17px}
.rich-toolbar button[data-rich-command^="align-"]{display:flex;align-items:center;justify-content:center;flex:0 0 34px;width:34px;padding:4px}.rich-toolbar button[data-rich-command^="align-"] svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rich-toolbar .rich-divider{height:22px;width:1px;background:var(--line);margin:0 2px}
.rich-toolbar select{flex:1 1 100px;width:auto;min-width:88px;max-width:148px;padding:7px 6px;font-size:12px;height:33px}
.rich-toolbar select[data-rich-command="font-size"]{flex:0 1 65px;min-width:65px}
.rich-toolbar input[type=color]{height:33px;width:36px;min-width:36px;padding:2px;cursor:pointer}
.rich-body{min-height:105px;max-height:260px;overflow:auto;outline:none;border-radius:0 0 7px 7px;padding:12px;color:#fff;background:#161616;font:400 17px/1.35 Arial,Helvetica,sans-serif;overflow-wrap:anywhere;white-space:pre-wrap;word-break:normal}
.rich-body:focus{box-shadow:inset 0 0 0 1px var(--orange)}
.rich-body:empty:before{content:attr(data-placeholder);color:#777;pointer-events:none}
.rich-body div,.rich-body p{margin:0;min-height:1em}
.rich-body span{white-space:inherit;overflow-wrap:anywhere}
.rich-toolbar button.active{background:var(--orange);border-color:var(--orange);color:#fff}.rich-toolbar button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.hidden{display:none!important}
.app{display:grid;grid-template-columns:clamp(332px,22vw,500px) minmax(0,1fr) clamp(378px,24vw,560px);grid-template-rows:64px minmax(0,1fr);height:100dvh}
.header{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--header);box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:5;min-width:0}
.brand{display:flex;align-items:center;min-width:190px;flex:0 0 190px}
.brand-lockup{display:flex;flex-direction:column;align-items:stretch;width:172px;padding:0 3px}
.brand-visual{height:34px;position:relative;display:flex;align-items:center}.brand-visual img{display:block;position:absolute;inset:0;width:100%;height:34px;object-fit:contain;object-position:left}.brand-fallback{font:900 25px/1 Roboto,Arial,sans-serif;letter-spacing:-1.7px;white-space:nowrap;color:#fff;user-select:none}
.brand-subtitle{display:flex;justify-content:space-between;width:100%;font:700 9.5px/1 Roboto,Arial,sans-serif;margin-top:2px;color:var(--text);white-space:nowrap;padding:0 2px}
.header-actions{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0}

.layout-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-left:2px}
.layout-tabs button{min-width:94px;min-height:42px;display:flex;justify-content:center;align-items:center;padding:8px 9px;background:var(--panel2)}
.layout-tabs button.active{background:var(--orange);border-color:var(--orange);color:#fff}
.sidebar{min-height:0;overflow:auto;padding:16px;background:var(--panel)}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line);position:relative;z-index:3}
.section{padding:14px;margin-bottom:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.section h2{margin:0 0 12px;padding-bottom:8px;border-bottom:3px solid var(--orange);font:700 18px/1 Khand,Roboto,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.section h3{margin:16px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--orange);font:700 16px/1 Khand,Roboto,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.field{margin:11px 0;min-width:0}
.field>label,.field-label{display:block;color:var(--muted);margin-bottom:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.field .check{display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px;font-weight:700;text-transform:none;letter-spacing:0;cursor:pointer}
.field .check input{margin:0}
.fields-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
.fields-2>.field{min-width:0}
.color-line{display:flex;justify-content:space-between;align-items:center;gap:10px}
.color-line .field-label{margin:0}
.row{display:flex;gap:8px;align-items:stretch}
.row>button{flex:1;min-width:0}
.add-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.add-grid button{width:100%;min-height:42px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 9px}
.layer-list{display:flex;flex-direction:column;gap:7px;min-height:0}
.layer-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;user-select:none;min-width:0;position:relative}
.layer-item:hover,.layer-item.active{border-color:var(--orange)}
.layer-item.active{box-shadow:inset 3px 0 var(--orange)}
.layer-item.dragging{opacity:.45}
.layer-item.drag-over{border-top:3px solid var(--orange);padding-top:7px}
.layer-item.hidden-layer .layer-name,.layer-item.hidden-layer .layer-preview{opacity:.45}
.layer-icon{width:28px;min-width:28px;height:28px;display:grid;place-items:center;padding:0;border:0;background:transparent;font-size:17px;line-height:1;flex:0 0 28px}
.layer-icon:hover{color:var(--orange);border:0;background:transparent}
.layer-name{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:400}
.layer-preview{flex:0 0 58px;width:58px;height:38px;display:block;border:1px solid var(--line);background:#111}
.layer-grip{color:var(--muted);font-weight:700;letter-spacing:-2px;flex:0 0 auto;cursor:grab;touch-action:none}
.layer-grip:active{cursor:grabbing}
#preview .blw-placement[data-blw-kind="smoke"],#preview .blw-placement[data-blw-kind="clouds"]{pointer-events:auto!important}
#preview .blw-resize-handle{position:absolute;width:12px;height:12px;border:2px solid #fff;background:var(--orange);border-radius:2px;z-index:50;box-shadow:0 0 0 1px #171717b8;pointer-events:auto!important;touch-action:none}
#preview .blw-resize-handle[data-corner="nw"]{top:-6px;left:-6px;cursor:nwse-resize}
#preview .blw-resize-handle[data-corner="ne"]{top:-6px;right:-6px;cursor:nesw-resize}
#preview .blw-resize-handle[data-corner="sw"]{bottom:-6px;left:-6px;cursor:nesw-resize}
#preview .blw-resize-handle[data-corner="se"]{bottom:-6px;right:-6px;cursor:nwse-resize}
.slider-field{margin:12px 0 15px}.slider-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px}.slider-label>label{margin:0;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.slider-value{color:var(--muted);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.slider-field input[type=range]{width:100%;display:block;margin:0;cursor:pointer}.slider-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.center-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.center-actions button{min-height:40px;padding:8px 7px}.canvas-resize-label{position:absolute;right:-1px;bottom:calc(100% + 10px);font:700 11px/1 Roboto,Arial,sans-serif;color:var(--orange);white-space:nowrap;pointer-events:none}
.empty-layers{border:1px dashed var(--line);color:var(--muted);padding:20px 11px;border-radius:8px;text-align:center;font-size:12px}
.canvas-context-menu{position:fixed;z-index:10000;display:grid;min-width:155px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow)}
.canvas-context-menu.hidden{display:none}
.canvas-context-menu button{border:0;border-radius:5px;background:transparent;text-align:left;padding:8px 10px}
.canvas-context-menu button:hover{background:var(--panel2);color:var(--orange)}
.canvas-context-menu button.danger:hover{color:#ff6b6b}
.layer-settings-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:0;position:relative;z-index:2}
.layer-settings-tabs button{width:100%;height:42px;padding:0;border-radius:8px 8px 0 0;border-bottom-color:var(--surface);display:grid;place-items:center}
.layer-settings-tabs button+button{border-left-width:0}
.layer-settings-tabs button.active{position:relative;z-index:3;background:var(--surface);color:var(--orange);border-color:var(--orange);border-bottom-color:var(--surface);margin-bottom:-1px}
.layer-settings-tabs button.active+button{border-left-width:1px}
.layer-settings-shell{margin-top:0}
.right.stack-mode .layer-settings-shell{margin-top:-1px;border-radius:0 0 8px 8px}
.right.stack-mode .layer-settings-shell>h2{display:none}
.workspace{position:relative;min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;background-color:var(--bg);background-image:linear-gradient(45deg,var(--checker) 25%,transparent 25%),linear-gradient(-45deg,var(--checker) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--checker) 75%),linear-gradient(-45deg,transparent 75%,var(--checker) 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px, -12px 0}
.workspace-top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line)}
.workspace-top strong{font:700 22px/1 Khand,Roboto,sans-serif;text-transform:uppercase}
.workspace-meta{color:var(--muted);font-weight:700;font-size:12px}
.stage-field{flex:1;min-height:250px;display:flex;align-items:center;justify-content:center;padding:26px 22px;overflow:auto}
.stage-holder{width:min(100%,850px);flex:0 1 auto;position:relative}
.stage-holder.sidebar-mode{width:min(100%,310px)}
#preview{box-shadow:var(--shadow)}
#preview .blw-placement{pointer-events:auto;cursor:grab;touch-action:none}
#preview .blw-placement:active{cursor:grabbing}
#preview .blw-placement.selected-layer{outline:1px dashed var(--orange);outline-offset:-1px}
#preview .blw-placement.selected-layer:after{content:"";position:absolute;inset:-2px;border:1px solid var(--orange);pointer-events:none}
#preview.blw-edit-background .blw-placement:not(.selected-layer),#preview.blw-edit-background .blw-placement:not(.selected-layer) *{pointer-events:none!important}
#preview .blw-placement[data-blw-backdrop="true"] .blw-resize-handle[data-corner="nw"]{top:1px;left:1px}
#preview .blw-placement[data-blw-backdrop="true"] .blw-resize-handle[data-corner="ne"]{top:1px;right:1px}
#preview .blw-placement[data-blw-backdrop="true"] .blw-resize-handle[data-corner="sw"]{bottom:1px;left:1px}
#preview .blw-placement[data-blw-backdrop="true"] .blw-resize-handle[data-corner="se"]{bottom:1px;right:1px}
#preview .blw-placeholder{display:flex!important}
#preview .blw-steam a{pointer-events:auto;cursor:grab}
.transport{padding:15px 19px 19px;background:var(--panel);border-top:1px solid var(--line)}
.transport-top{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.transport-top .status{flex:1;min-width:100px;color:var(--muted);font-size:12px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.transport button{min-width:75px}
.timeline{display:flex;align-items:center;gap:12px}
.timeline input{flex:1;min-width:0}

.inline-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.inline-actions>button{min-width:0;min-height:40px;white-space:normal;font-size:12px;padding:8px}
.sequence-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0 13px}
.sequence-actions button{min-width:0;font-size:12px;padding:9px 5px}
.sequence-list{max-height:36vh;min-height:0;overflow:auto;padding:1px 2px 2px 1px}
.sequence-item .layer-name{font-weight:500}
.sequence-summary{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sequence-summary .field{margin:1px 0 8px}
.sequence-summary .muted{font-size:11px}
.sequence-editor{margin-top:16px;padding-top:10px;border-top:1px solid var(--line)}
.sequence-editor>h3{margin-top:2px}
.sequence-editor-empty{padding:14px;text-align:center;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:12px}
.highlight-row{display:grid;grid-template-columns:minmax(0,1fr) 44px 27px;gap:6px;align-items:center;margin:0 0 8px}
.highlight-row input[type=color]{width:44px;height:38px}
.highlight-row .icon-btn{font-size:19px}
.icon-btn{padding:5px;min-width:27px;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1}
.icon-btn:hover{color:var(--orange);border:0;background:transparent}
.mini{font-size:12px;padding:7px 9px}
.full{width:100%}
.uploader{display:flex;gap:7px;align-items:center;margin:9px 0 12px}
.uploader>button{flex:1}
.uploader .file-state{color:var(--muted);font-size:11px;max-width:135px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.subheading{font:700 17px/1 Khand,Roboto,sans-serif;text-transform:uppercase;color:var(--text);margin:18px 0 10px;padding-bottom:8px;border-bottom:3px solid var(--orange)}
hr{border:0;border-top:1px solid var(--line);margin:15px 0}
#notice{position:fixed;right:18px;bottom:18px;z-index:40;background:var(--panel);color:var(--text);border:1px solid var(--orange);border-radius:8px;padding:12px 15px;max-width:380px;box-shadow:var(--shadow);display:none;font-size:13px}
#notice.show{display:block}
#message-dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;max-width:min(460px,calc(100vw - 30px));width:100%;padding:0;box-shadow:var(--shadow)}
#message-dialog::backdrop,.steam-template-dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
.steam-template-dialog{width:min(780px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.steam-template-dialog[open]{display:flex;flex-direction:column}
.steam-template-dialog form{display:contents}
.template-header{padding:12px 16px;background:#101010;border-bottom:3px solid var(--orange);display:flex;justify-content:space-between;align-items:center;gap:12px}
.template-header h2{margin:0;font:700 24px/1 Khand,Roboto,sans-serif;text-transform:uppercase}
.template-header button{width:35px;height:35px;padding:3px;font-size:22px;line-height:1;background:transparent;border:0}
.template-content{padding:15px 18px;overflow-y:auto;min-height:0}
.template-content .field:first-child{margin-top:0}
.template-status{margin:10px 0;color:var(--muted);font-size:12px;min-height:16px}
.template-status.error{color:#ff8a8a}
.template-game{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 0 4px}
.template-game strong{font:700 20px/1.2 Khand,Roboto,sans-serif}
.template-game span{font-size:12px;color:var(--muted)}
.template-screenshots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:8px 0}
.template-screenshot{padding:4px;border:2px solid var(--line);background:var(--panel2);border-radius:8px;overflow:hidden;aspect-ratio:16/9;min-width:0}
.template-screenshot:hover,.template-screenshot.active{border-color:var(--orange)}
.template-screenshot img{width:100%;height:100%;object-fit:cover;display:block;border-radius:4px}
#template-bullets{min-height:130px}
#template-details[hidden]{display:none}
@media(max-width:560px){.template-screenshots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dialog-header{padding:15px 18px;border-bottom:3px solid var(--orange);background:#101010;color:#fff;font:700 23px/1 Khand,Roboto,sans-serif;text-transform:uppercase}
.dialog-content{padding:17px 18px;line-height:1.55}
.dialog-actions{padding:14px 18px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:12px;align-items:center}.steam-template-dialog .dialog-actions{gap:24px;padding:18px 20px 22px}.steam-template-dialog .dialog-actions button{min-width:140px}.template-screenshot{position:relative}.template-screenshot-label{position:absolute;left:4px;right:4px;bottom:4px;padding:4px 5px;background:rgba(0,0,0,.81);color:#fff;border-radius:0 0 4px 4px;font:700 10px/1.2 Roboto,Arial,sans-serif;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}.history-actions{display:flex;gap:6px;margin-right:2px}.history-actions button{min-width:62px;padding:9px 10px}
.muted{color:var(--muted)}
*{scrollbar-width:thin;scrollbar-color:var(--orange) var(--panel2)}
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-track{background:var(--panel2);border-radius:999px}
*::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--orange),var(--orange2));border:3px solid var(--panel2);border-radius:999px}
*::-webkit-scrollbar-thumb:hover{background:var(--orange2)}

<script>
'use strict';
function blwSanitizeRichHTML(raw){
  var template=document.createElement('template');template.innerHTML=String(raw==null?'':raw);
  var allowed={B:'b',STRONG:'strong',I:'i',EM:'em',U:'u',BR:'br',DIV:'div',P:'p',SPAN:'span',FONT:'span'};
  function cleanChildren(parent,destination,depth){
    if(depth>32)return;
    Array.from(parent.childNodes).forEach(function(node){
      if(node.nodeType===3){destination.appendChild(document.createTextNode(node.nodeValue||''));return;}
      if(node.nodeType!==1)return;
      var tag=node.tagName;
      if(['SCRIPT','STYLE','IFRAME','SVG','MATH','IMG','VIDEO','AUDIO','OBJECT','FORM'].includes(tag))return;
      var type=allowed[tag];
      if(!type){cleanChildren(node,destination,depth+1);return;}
      var next=document.createElement(type);
      var properties={};
      var rawColor=node.style&&node.style.color||tag==='FONT'&&node.getAttribute('color')||'';
      if(/^#[0-9a-f]{3,8}$/i.test(rawColor)||/^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}(?:\s*,\s*(?:0|1|0?\.\d+))?\s*\)$/i.test(rawColor))properties.color=rawColor;
      var rawFont=node.style&&node.style.fontFamily||tag==='FONT'&&node.getAttribute('face')||'';
      if(rawFont&&/^(?:(?:Arial|Roboto|Khand|Georgia|Impact|Consolas|Times New Roman|Helvetica|serif|sans-serif|monospace)(?:\s*,\s*)?)+$/i.test(rawFont.replace(/["']/g,'')))properties.fontFamily=rawFont.replace(/["']/g,'');
      var rawSize=node.style&&node.style.fontSize||'';
      if(/^\d{1,3}(?:\.\d+)?(?:px|em|%)$/.test(rawSize))properties.fontSize=rawSize;
      if(tag==='FONT'&&node.getAttribute('size')&&!rawSize){var size=Number(node.getAttribute('size'));if(size>=1&&size<=7)properties.fontSize=([0,.65,.8,1,1.25,1.6,2,2.5][size])+'em';}
      var deco=node.style&&node.style.textDecoration||'';
      if(/^underline(?:\s+solid)?$/i.test(deco))properties.textDecoration='underline';
      var weight=node.style&&node.style.fontWeight||'';
      if(/^(?:bold|normal|[1-9]00)$/.test(weight))properties.fontWeight=weight;
      var italic=node.style&&node.style.fontStyle||'';
      if(/^(?:normal|italic)$/.test(italic))properties.fontStyle=italic;
      Object.keys(properties).forEach(function(prop){next.style[prop]=properties[prop];});
      if(tag!=='BR')cleanChildren(node,next,depth+1);
      destination.appendChild(next);
    });
  }
  var output=document.createElement('div');cleanChildren(template.content,output,0);
  return output.innerHTML;
}
function blwIsPinnedBackground(item){
  if(!item||item.type!=='image'||item.fit!=='cover')return false;
  if(item.viewportBackground===true)return true;
  if(item.viewportBackground===false)return false;
  return /^(?:Steam artwork|Steam screenshot)$/i.test(String(item.name||'').trim());
}
function blwPositionCover(img,parent,item){
  if(!img||!img.naturalWidth||!img.naturalHeight||!parent.clientWidth||!parent.clientHeight)return;
  function numeric(value,fallback){return value==null||value===''||!Number.isFinite(Number(value))?fallback:Number(value);}
  function bounded(value,min,max){return Math.max(min,Math.min(max,value));}
  var boxW=parent.clientWidth,boxH=parent.clientHeight;
  var pinned=blwIsPinnedBackground(item);
  var zoom=bounded(numeric(item.imageZoom,100),100,400)/100;
  var stretchW=pinned?bounded(numeric(item.w,100),100,500)/100:1;
  var stretchH=pinned?bounded(numeric(item.h,100),100,500)/100:1;
  var scale=Math.max(boxW/img.naturalWidth,boxH/img.naturalHeight)*zoom;
  var drawW=Math.max(boxW,img.naturalWidth*scale*stretchW);
  var drawH=Math.max(boxH,img.naturalHeight*scale*stretchH);
  var extraX=Math.max(0,drawW-boxW),extraY=Math.max(0,drawH-boxH);
  var panX=bounded(numeric(pinned?item.x:item.imagePanX,50),0,100);
  var panY=bounded(numeric(pinned?item.y:item.imagePanY,50),0,100);
  img.style.width=drawW+'px';img.style.height=drawH+'px';
  img.style.left=-extraX*panX/100+'px';
  img.style.top=-extraY*panY/100+'px';
  img.style.objectFit='fill';
}
function bannerPlayer(root,initialConfig,opts){
  opts=opts||{};
  var config=initialConfig;
  var elapsed=0;
  var playing=true;
  var lastFrame=null;
  var frameId=0;
  var lastUpdate=0;
  var stacks=[];
  var scaled=[];
  var coverImages=[];
  var reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function num(v,f){return v==null||v===''||!Number.isFinite(Number(v))?f:Number(v);}
  function safeURL(v){return /^https?:\/\/[^\s]+$/i.test(String(v||'').trim())?String(v).trim():'';}
  function src(asset){return safeURL(asset.url)||(opts.preview?String(asset.localPreview||asset.src||''):'');}
  function rgb(value){var h=String(value||'#cad5e8').replace('#','');if(!/^[0-9a-f]{3}([0-9a-f]{3})?$/i.test(h))h='cad5e8';if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');return [0,2,4].map(function(i){return parseInt(h.slice(i,i+2),16);}).join(',');}

  function setText(parent,value,rules){
    var text=String(value||'');
    var list=(Array.isArray(rules)?rules:[]).filter(function(rule){return rule&&String(rule.phrase||'').trim();}).map(function(rule){
      var escaped=String(rule.phrase).trim().split(/\s+/).map(function(word){return word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('\\s+');
      return {pattern:new RegExp(escaped,'gi'),color:rule.color};
    });
    parent.replaceChildren();
    if(!list.length){parent.textContent=text;return;}
    var cursor=0;
    while(cursor<text.length){
      var best=null;
      list.forEach(function(rule){
        rule.pattern.lastIndex=cursor;
        var match=rule.pattern.exec(text);
        if(match&&(!best||match.index<best.index||(match.index===best.index&&match[0].length>best.length))){best={index:match.index,length:match[0].length,color:rule.color};}
      });
      if(!best){parent.appendChild(document.createTextNode(text.slice(cursor)));break;}
      if(best.index>cursor)parent.appendChild(document.createTextNode(text.slice(cursor,best.index)));
      var mark=addClass('span','blw-colored-word',parent);
      mark.style.color=/^#[\da-f]{6}$/i.test(String(best.color||''))?best.color:'#f47938';
      mark.textContent=text.slice(best.index,best.index+best.length);
      cursor=best.index+best.length;
    }
  }
  function addText(parent,layer,value,rules,html){

  function legacyRichMarkup(source){

    var cursor=0;
    while(cursor<content.length){
      var best=null;
      rules.forEach(function(rule){var needle=String(rule.phrase).toLowerCase(),position=content.toLowerCase().indexOf(needle,cursor);if(position>=0&&(!best||position<best.position))best={position:position,length:needle.length,color:rule.color};});

      if(best.position>cursor)scratch.appendChild(document.createTextNode(content.slice(cursor,best.position)));

  var thumbnailCache=new Map();
  function drawTextThumbnail(ctx,text,color){
    var value=String(text||'').replace(/\s+/g,' ').trim()||'T';
    var fontSize=value.length>60?11:value.length>32?13:value.length>19?15:18;
    ctx.font='700 '+fontSize+'px Arial,sans-serif';
    ctx.fillStyle=/^#[\da-f]{6}$/i.test(color||'')?color:'#ffffff';
    ctx.textAlign='center';ctx.textBaseline='middle';
    var words=value.split(' '),lines=[],line='';
    words.forEach(function(word){
      var next=line?line+' '+word:word;
      if(line&&ctx.measureText(next).width>104){lines.push(line);line=word;}
      else line=next;
    });
    if(line)lines.push(line);
    lines=lines.slice(0,4);
    var lineHeight=fontSize*1.18;
    var y=38-(lines.length-1)*lineHeight/2;
    lines.forEach(function(part){ctx.fillText(part.slice(0,50),58,y,105);y+=lineHeight;});
  }
  function thumbnailImage(canvas,ctx,url){
    var cached=thumbnailCache.get(url);
    if(!cached){
      cached={image:new Image(),callbacks:[]};
      thumbnailCache.set(url,cached);
      cached.image.onload=function(){cached.callbacks.splice(0).forEach(function(callback){callback();});};
      cached.image.onerror=function(){cached.callbacks.splice(0).forEach(function(callback){callback();});};
      cached.image.src=url;
    }
    var image=cached.image;
    if(!image.complete||!image.naturalWidth){
      if(!image.complete)cached.callbacks.push(function(){if(canvas.isConnected)drawThumbnail(canvas,canvas._blwSource);});
      return false;
    }
    var scale=Math.min(106/image.naturalWidth,67/image.naturalHeight);
    var w=image.naturalWidth*scale,h=image.naturalHeight*scale;
    try{ctx.drawImage(image,(116-w)/2,(76-h)/2,w,h);return true;}catch(error){return false;}
  }
  function drawThumbnail(canvas,source){
    if(!canvas||!source)return;
    canvas._blwSource=source;
    canvas.width=116;canvas.height=76;
    var ctx=canvas.getContext('2d');if(!ctx)return;
    ctx.fillStyle='#171717';ctx.fillRect(0,0,116,76);
    if(source.type==='stack'){
      var stack=source;
      source=(stack.steps||[]).find(function(step){return step.id===selectedStepId&&stack.id===selectedId&&step.visible!==false;})||(stack.steps||[]).find(function(step){return step.visible!==false;})||{type:'text',text:'Sequence',color:'#ffffff'};
    }
    if(source.type==='image'){
      var sourceUrl=validURL(source.url)?source.url:source.localPreview||'';
      if(sourceUrl&&thumbnailImage(canvas,ctx,sourceUrl))return;
      drawTextThumbnail(ctx,'IMAGE','#8e9ba9');
    }else if(source.type==='text'){
      drawTextThumbnail(ctx,source.text,source.color);
    }else if(source.type==='steam'){
      ctx.fillStyle='#385022';ctx.fillRect(7,12,102,52);
      ctx.fillStyle='#b6d797';ctx.font='11px Arial';ctx.textAlign='center';ctx.fillText(String(source.dateLabel||'Steam').slice(0,19),58,29,92);
      ctx.fillStyle='#70a927';ctx.fillRect(17,35,82,21);
      ctx.fillStyle='#f4fbe5';ctx.font='700 11px Arial';ctx.fillText('WISHLIST',58,49);
    }else if(source.type==='pause'){
      drawTextThumbnail(ctx,'PAUSE','#f47938');
    }else if(source.type==='clouds'||source.type==='smoke'){
      var gradient=ctx.createRadialGradient(57,45,0,57,45,60);
      gradient.addColorStop(0,source.color||'#a6bbda');gradient.addColorStop(1,'#171717');
      ctx.fillStyle=gradient;ctx.fillRect(0,0,116,76);
    }else drawTextThumbnail(ctx,glyph(source.type),'#f47938');
  }

      var u=new URL(String(url).trim());
      if(u.protocol!=='https:'||!/(^|\.)steampowered\.com$/i.test(u.hostname))return null;
      var m=u.pathname.match(/^\/(?:app|widget)\/(\d{1,10})(?:\/|$)/);
      return m?m[1]:null;
    }catch(e){return null;}
  }
  function templateMessage(message,error){templateStatus.textContent=message;templateStatus.classList.toggle('error',!!error);}
  function validSteamImage(url){
    return validURL(url)&&/^https:\/\//i.test(String(url));
  }
  function templateRelease(game){
    var release=game.release_date||{};
    var raw=String(release.date||'').trim();
    if(!release.coming_soon)return 'AVAILABLE NOW';
    if(!raw||/^(?:to be announced|tba|coming soon|coming soon\.?|tbd)$/i.test(raw))return 'COMING SOON';
    if(/^\d{4}$/.test(raw))return 'COMING IN '+raw;
    return 'COMING '+raw.toUpperCase();
  }
  function steamDateLabel(game){
    var raw=String((game.release_date||{}).date||'').trim();
    if(!(game.release_date||{}).coming_soon)return 'Available now';
    if(!raw||/^(?:to be announced|tba|coming soon|tbd)$/i.test(raw))return 'Coming soon';
    return 'Available: '+raw;
  }
  function steamFeatureCopy(game){
    function clean(value){return String(value||'').replace(/[\u00a0\u200b]/g,' ').replace(/^(?:\s*[\u2022\u2023\u2027\u2043\u2219\u00b7\u25a0-\u25ff\u2605\u2606\u2610-\u2612\u2713-\u2718\u2794\u2b1b\u2b1c\u30fb\u2014\u2013-]\s*)+/u,'').replace(/\s+/g,' ').trim();}
    var html=String(game.about_the_game||game.detailed_description||'');
    var doc=new DOMParser().parseFromString(html,'text/html');
    doc.querySelectorAll('script,style,img,video,svg,iframe').forEach(function(node){node.remove();});
    var candidates=[];
    doc.querySelectorAll('li').forEach(function(node){
      var full=clean(node.textContent);
      var heading=Array.from(node.querySelectorAll('strong,b,h3,h4,h5,[style*="font-weight"]')).find(function(el){
        var title=clean(el.textContent);
        return title.length>=3&&full.slice(0,title.length).toLocaleLowerCase()===title.toLocaleLowerCase();
      });
      if(heading){candidates.push(clean(heading.textContent));return;}
      var fragments=[],stopped=false;
      Array.from(node.childNodes).forEach(function(child){
        if(stopped)return;
        if(child.nodeType===1&&child.tagName==='BR'){stopped=true;return;}
        if(child.nodeType===1&&(child.tagName==='P'||child.tagName==='DIV')){
          if(fragments.length){stopped=true;return;}
          var block=child.cloneNode(true);
          var br=block.querySelector('br');
          if(br){var range=block.ownerDocument.createRange();range.selectNode(br);range.setEndAfter(block.lastChild);range.deleteContents();}
          fragments.push(block.textContent);stopped=true;return;
        }
        fragments.push(child.textContent||'');
      });
      var line=clean(fragments.join(' '))||full;
      candidates.push(line.length<=110?line:clean(line.split(/(?<=[.!?])\s+/)[0]).slice(0,110));
    });
    if(candidates.length<2){
      doc.querySelectorAll('h2,h3,h4,strong,b').forEach(function(node){
        var title=clean(node.textContent);
        if(title.length>=3&&title.length<=140)candidates.push(title);
      });
    }
    if(candidates.length<2){
      doc.querySelectorAll('p').forEach(function(node){
        var phrase=clean(node.textContent);
        if(phrase.length>=20&&phrase.length<=225)candidates.push(phrase);
      });
    }
    if(candidates.length<2){
      var plain=clean(doc.body&&doc.body.textContent||'');
      var short=clean(game.short_description||'');
      [short,plain].forEach(function(text){
        text.split(/(?<=[.!?])\s+(?=[A-Z0-9])/).forEach(function(sentence){if(sentence.length>20)candidates.push(sentence);});
      });
    }
    var seen=new Set();
    var out=candidates.filter(function(value){
      if(value.length<3||/^(?:about this game|features|key features|system requirements|downloadable content)$/i.test(value))return false;
      var key=value.toLocaleLowerCase().replace(/[^a-z0-9]/g,'');
      if(seen.has(key))return false;
      seen.add(key);
      return true;
    }).map(function(value){
      if(value.length<=122)return value;
      var clipped=value.slice(0,119).replace(/\s+\S*$/,'').replace(/[\s,;:.]+$/,'');
      return clipped+'…';
    });
    return out.slice(0,12);
  }
  function getSteamScreenshots(game){
    var images=[],seen=new Set();
    function add(url,thumb,label,kind){
      if(!validSteamImage(url)||seen.has(url))return;
      images.push({full:url,thumb:validSteamImage(thumb)?thumb:url,label:label,kind:kind});seen.add(url);
    }
    add(game.header_image,game.header_image,'Steam banner art','banner');
    add(game.capsule_image,game.capsule_image,'Steam capsule','banner');
    add(game.capsule_imagev5,game.capsule_imagev5,'Small capsule','banner');
    add(game.background_raw||game.background,game.background_raw||game.background,'Store background','banner');
    add(game.library_hero,game.library_hero,'Library hero','banner');
    (Array.isArray(game.screenshots)?game.screenshots:[]).slice(0,18).forEach(function(item,index){
      add(String(item.path_full||''),String(item.path_thumbnail||item.path_full||''),'Screenshot '+(index+1),'screenshot');
    });
    return images;
  }
  async function fetchSteamGame(appId){
    var endpoint='https://store.steampowered.com/api/appdetails?appids='+appId+'&cc=us&l=english';
    var urls=['https://proxy.cors.dev/'+endpoint,'https://api.allorigins.win/raw?url='+encodeURIComponent(endpoint)];
    var lastError=null;
    for(var i=0;i<urls.length;i++){
      var controller=new AbortController();
      var timeout=setTimeout(function(){controller.abort();},10000);
      try{
        var response=await fetch(urls[i],{credentials:'omit',signal:controller.signal,cache:'no-store'});
        if(!response.ok)throw new Error('Steam metadata request failed');
        var result=await response.json();
        var record=result&&result[appId];
        if(record&&record.success&&record.data){clearTimeout(timeout);return record.data;}
        if(record&&record.success===false)throw new Error('Steam has no public data for this game');
        throw new Error('Invalid Steam response');
      }catch(error){lastError=error;}finally{clearTimeout(timeout);}
    }
    throw lastError||new Error('Steam details unavailable');
  }
  function selectedTemplateImage(){return templateImages[templateScreenshot]||null;}
  function renderTemplateImages(){
    var list=document.getElementById('template-screenshots');
    list.innerHTML=templateImages.map(function(item,index){return '<button class="template-screenshot'+(index===templateScreenshot?' active':'')+'" type="button" data-template-shot="'+index+'" aria-label="'+esc(item.label)+'" title="'+esc(item.label)+'" aria-pressed="'+(index===templateScreenshot?'true':'false')+'"><img src="'+esc(item.thumb)+'" alt="" loading="lazy"><span class="template-screenshot-label">'+esc(item.label)+'</span></button>';}).join('');
  }
  function resetTemplate(){
    templateRequest++;
    templateData=null;templateImages=[];templateScreenshot=0;
    templateDetails.hidden=true;templateCreate.disabled=true;templateFetch.disabled=false;templateFetch.textContent='Fetch game';
    templateMessage('');
  }
  document.getElementById('steam-template-open').addEventListener('click',function(){
    resetTemplate();
    templateDialog.showModal();
    document.getElementById('template-steam-url').focus();
  });
  function closeTemplate(){templateDialog.close();resetTemplate();}
  document.getElementById('steam-template-close').addEventListener('click',closeTemplate);
  document.getElementById('template-cancel').addEventListener('click',closeTemplate);
  templateDialog.addEventListener('close',resetTemplate);
  document.getElementById('template-logo-url').addEventListener('input',function(){
    if(templateData){
      var value=this.value.trim();
      templateMessage(value&&!validSteamImage(value)?'Enter a hosted PNG, JPG, or WebP image URL.':'');
    }
  });
  templateForm.addEventListener('submit',async function(event){
    event.preventDefault();
    var steamURL=document.getElementById('template-steam-url').value.trim();
    var appId=steamAppId(steamURL);
    if(!appId){templateMessage('Enter a valid Steam app or widget URL.',true);return;}
    var requestId=++templateRequest;
    templateData=null;templateDetails.hidden=true;templateCreate.disabled=true;
    templateFetch.disabled=true;templateFetch.textContent='Fetching…';templateMessage('Fetching game details…');
    try{
      var game=await fetchSteamGame(appId);
      if(requestId!==templateRequest||!templateDialog.open)return;
      templateData={appId:appId,game:game};
      templateImages=getSteamScreenshots(game);
      var storeIndex=templateImages.findIndex(function(item){return item.label==='Store background';});
      templateScreenshot=storeIndex>=0?storeIndex:Math.max(0,templateImages.findIndex(function(item){return item.kind==='screenshot';}));
      document.getElementById('template-game-title').textContent=String(game.name||'Steam game');
      document.getElementById('template-game-release').textContent=templateRelease(game);
      document.getElementById('template-bullets').value=steamFeatureCopy(game).join('\n');
      renderTemplateImages();
      templateDetails.hidden=false;templateCreate.disabled=false;
      templateMessage('Game details loaded.');
    }catch(error){
      if(requestId!==templateRequest||!templateDialog.open)return;
      templateMessage('Unable to retrieve Steam details. Check the URL and try again.',true);
    }finally{
      if(requestId===templateRequest){templateFetch.disabled=false;templateFetch.textContent='Fetch game';}
    }
  });
  document.getElementById('template-screenshots').addEventListener('click',function(event){
    var button=event.target.closest('[data-template-shot]');if(!button)return;
    templateScreenshot=Number(button.dataset.templateShot);
    renderTemplateImages();
  });
  document.getElementById('template-create').addEventListener('click',function(){
    if(!templateData)return;
    var game=templateData.game,appId=templateData.appId;
    var logoURL=document.getElementById('template-logo-url').value.trim();
    if(logoURL&&!validSteamImage(logoURL)){templateMessage('Enter a valid hosted logo image URL, or leave it blank.',true);return;}
    if(project.layers.length&&!window.confirm('Replace the current banner with this Steam template?'))return;
    var screenshot=selectedTemplateImage();
    var screenshotURL=screenshot?screenshot.full:validURL(game.header_image)?game.header_image:'';
    var features=document.getElementById('template-bullets').value.split(/\r?\n/).map(function(line){return line.replace(/^(?:\s*[\u2022\u2023\u2027\u2043\u2219\u00b7\u25a0-\u25ff\u2605\u2606\u2610-\u2612\u2713-\u2718\u2794\u2b1b\u2b1c\u30fb\u2014\u2013-]\s*)+/u,'').trim();}).filter(Boolean).slice(0,12);
    var url='https://store.steampowered.com/app/'+appId+'/';
    var next={version:6,name:String(game.name||'Steam game').slice(0,120),layout:project.layout,background:'#202020',backgroundMode:'auto',linkUrl:url,newTab:true,layers:[]};
    if(screenshotURL){
      var background=newLayer('image');
      background.name=screenshot&&screenshot.kind==='banner'?'Steam artwork':'Steam screenshot';background.viewportBackground=true;background.x=50;background.y=50;background.w=100;background.h=100;background.fit='cover';background.imageZoom=100;background.imagePanX=50;background.imagePanY=50;background.panMode=true;background.brightness=58;
      background.url=screenshotURL;background.alt=String(game.name||'Game')+' artwork';
      next.layers.push(background);
    }
    var clouds=newLayer('clouds');
    clouds.name='Clouds';clouds.x=50;clouds.y=50;clouds.w=200;clouds.h=200;
    next.layers.push(clouds);
    var stack=newLayer('stack');
    stack.name='Sequence';stack.x=50;stack.y=50;stack.w=project.layout==='sidebar'?90:94;stack.h=project.layout==='sidebar'?76:92;
    stack.fontSize=project.layout==='sidebar'?32:26;stack.fontWeight=800;stack.color='#ffffff';stack.align='center';stack.shadow=true;stack.loop=true;
    stack.steps=[];
    features.forEach(function(copy,index){
      var step=stepFactory('text');
      step.name='Feature '+(index+1);step.text=copy;step.hold=2200;
      stack.steps.push(step);
    });
    if(logoURL){
      var logo=stepFactory('image');logo.name='Game logo';logo.url=logoURL;logo.alt=String(game.name||'Game')+' logo';logo.imageWidth=84;logo.imageHeight=94;logo.hold=2300;
      stack.steps.push(logo);
    }else{
      var title=stepFactory('text');title.name='Game title';title.text=String(game.name||'Game');title.richHtml='<strong style="font-size:1.1em">'+esc(title.text)+'</strong>';title.hold=2300;
      stack.steps.push(title);
    }
    var upcoming=(game.release_date||{}).coming_soon!==false;
    var release=stepFactory('text');release.name=upcoming?'Release date':'Available now';release.text=templateRelease(game);release.hold=1800;
    stack.steps.push(release);
    if(upcoming){
      var wishlist=stepFactory('text');wishlist.name='Wishlist today';wishlist.text='WISHLIST TODAY';wishlist.hold=1500;
      stack.steps.push(wishlist);
    }
    var action=stepFactory('steam');action.name=upcoming?'Steam wishlist':'View on Steam';action.url=url;action.buttonText=upcoming?'Wishlist on Steam':'View on Steam';action.dateLabel=steamDateLabel(game);
    action.orientation='default';action.fullBox=upcoming;action.hold=10000;action.inMs=450;action.outMs=350;
    stack.steps.push(action);
    next.layers.push(stack);
    project=next;selectedId=stack.id;selectedStepId=stack.steps[0]&&stack.steps[0].id||null;settingsTab='sequence';
    player.restart();syncEditor();player.play();
    closeTemplate();toast('Steam template created.');
  });
  document.getElementById('load-config').addEventListener('click',function(){document.getElementById('config-picker').click();});
  document.getElementById('config-picker').addEventListener('change',async function(event){
    var file=event.target.files&&event.target.files[0];if(!file)return;
    try{
      var text=await file.text();
      var data=normalizeProject(JSON.parse(text));
      project=data;selectedId=null;selectedStepId=null;settingsTab='layer';player.restart();syncEditor();toast('Config loaded.');
    }catch(error){dialog('Import failed','Choose a valid Banner Lab JSON config file.');}
    event.target.value='';
  });
  document.getElementById('dialog-close').addEventListener('click',function(){document.getElementById('message-dialog').close();});
  window.addEventListener('beforeunload',function(){localURLs.forEach(function(url){URL.revokeObjectURL(url);});});
  syncEditor();
  refreshHistoryButtons();
})();
</script>
